[package]
name = "bifrost"
version = "0.1.7"
edition = "2024"

[workspace]
members = []

[workspace.dependencies]
async-trait = { version = "0.1" }
# Pingora
pingora = { version = "0.8", features = ["lb", "openssl"] }
pingora-limits = { version = "0.8" }
pingora-openssl = "0.3"

openssl = "0.10"
http = { version = "1.3" }
url = "2.5"
cookie = { version = "0.18" }
anyhow = "1.0"
# serde
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
toml = "0.9"
serde_yaml = "0.8"

bytes = "1.12"
constcat = "0.6"
tokio = { version = "1.0", features = [
    "macros",
    "net",
    "parking_lot",
    "process",
    "rt",
    "fs",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
nacos-sdk = { version = "0.5", features = ["default"] }
redact = { version = "0.1" }
jsonwebtoken = { version = "10.1", features = ["rust_crypto"] }
futures = "0.3"
enum-kinds = "0.5"
enum-as-inner = "0.6"
clap = { version = "4.5", features = ["derive", "env"] }
partialdebug = "0.2"
regex = "1.12"
# for web application
axum = { version = "0.8", features = ["macros", "multipart"] }
axum_l10n = { version = "0.5" }
unic-langid = { version = "0.9" }
base64 = "0.22"
# ORM
diesel = { version = "2.3", default-features = false, features = [
    "postgres",
    "32-column-tables",
    "time",
] }
bb8 = "0.9"
diesel-async = { version = "0.9", features = [
    "postgres",
    "bb8",
    "async-connection-wrapper",
] }
diesel_json = { version = "0.3" }
# cache
moka2 = "0.13"
# API doc
aide = { version = "0.15", features = [
    "axum",
    "axum-json",
    "axum-query",
    "axum-extra-headers",
] }
schemars = { version = "0.9" }
real-ip = "0.1"
matchit = "0.9"
# Http client reqwest
reqwest = { version = "0.12", default-features = false, features = [
    "gzip",
    "brotli",
    "deflate",
    "rustls-tls",
    "cookies",
    "json",
] }

# Tracing
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "local-time",
] }
tracing-appender = "0.2"
tracing-indicatif = { version = "0.3" }
tracing-error = "0.2"
# Tracing sentry
sentry = { version = "0.42", features = [
    "rustls",
    "backtrace",
    "contexts",
    "debug-images",
    "panic",
    "reqwest",
    "tracing",
] }
sentry-anyhow = "0.42"
tracing-opentelemetry = "0.29"
opentelemetry = "0.28"
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio"] }
strum = "0.27"
strum_macros = "0.27"

[dependencies]
async-trait = { workspace = true }
pingora = { workspace = true }
pingora-limits = { workspace = true }
pingora-openssl = { workspace = true }
openssl = { workspace = true }
http = { workspace = true }
url = { workspace = true }
cookie = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
serde_yaml = { workspace = true }
axum = { workspace = true }
axum_l10n = { workspace = true }
unic-langid = { workspace = true }
bytes = { workspace = true }
constcat = { workspace = true }
tokio = { workspace = true }
nacos-sdk = { workspace = true, optional = true }
redact = { workspace = true }
jsonwebtoken = { workspace = true }
futures = { workspace = true }
enum-kinds = { workspace = true }
enum-as-inner = { workspace = true }
clap = { workspace = true }
partialdebug = { workspace = true }
regex = { workspace = true }
base64 = { workspace = true }
# ORM
diesel = { workspace = true }
diesel-async = { workspace = true }
bb8 = { workspace = true }
diesel_json = { workspace = true }
# cache
moka2 = { workspace = true }
# API doc
aide = { workspace = true }
schemars = { workspace = true }
real-ip = { workspace = true }
matchit = { workspace = true }
# Http Client
reqwest = { workspace = true }
# Tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-indicatif = { workspace = true }
tracing-appender = { workspace = true }
tracing-error = { workspace = true }
# Sentry
sentry-anyhow = { workspace = true, optional = true }
strum = { workspace = true }
strum_macros = { workspace = true }
sentry = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

[dev-dependencies]
rstest = "0.25"
test-log = "0.2"

[features]
default = ["nacos"]
nacos = ["nacos-sdk"]
sentry-tracing = [
    "sentry-anyhow",
    "sentry",
    "opentelemetry",
    "opentelemetry_sdk",
    "tracing-opentelemetry",
]
